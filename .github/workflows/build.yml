
name: Build ZuriDash APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extraer ZIP
        run: unzip -q ZuriDash.zip

      - name: Compilar APK
        working-directory: ZuriDash
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ZuriDash-APK
          path: ZuriDash/app/build/outputs/apk/debug/app-debug.apk
